services:
  - type: web
    name: domainsuite-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_URL
        sync: false
      - key: META_TITLE
        sync: false
      - key: META_DESCRIPTION
        sync: false
